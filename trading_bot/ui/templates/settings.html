{% extends "base.html" %}

{% block title %}Settings - Trading Bot{% endblock %}

{% block content %}
    <h2>Settings</h2>
    <div class="settings-form">
        <h3>Trading Mode</h3>
        <p>Select whether the bot should operate in simulation (paper trading) or live mode.</p>
        <form method="POST" action="{{ url_for('settings') }}">
            <div class="form-group">
                <label>
                    <input type="radio" name="trading_mode" value="sim" {% if current_mode == 'sim' %}checked{% endif %}>
                    Paper Trading (Simulation)
                </label>
            </div>
            <div class="form-group">
                <label>
                    <input type="radio" name="trading_mode" value="live" {% if current_mode == 'live' %}checked{% endif %}>
                    Live Trading
                </label>
            </div>
            <button type="submit" class="btn">Save Settings</button>
        </form>
    </div>
{% endblock %}
